name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pypinyin pyperclip flake8

      - name: Lint
        run: |
          flake8 pinyin_tool.py test_pinyin_tool.py test_pinyin_functions.py test_types.py pinyin_types.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit tests (core)
        run: |
          python -m unittest test_pinyin_tool.py -v

      - name: Run unit tests (functions)
        run: |
          python -m unittest test_pinyin_functions.py -v

      - name: Run unit tests (types)
        run: |
          python -m unittest test_types.py -v

      - name: Quick smoke test
        run: |
          python -c "from pypinyin import pinyin, Style; print(pinyin('你好', style=Style.NORMAL))"

  docker-build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t pinyin-tool .

